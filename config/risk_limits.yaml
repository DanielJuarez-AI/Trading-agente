schema_version: "1.0.0"
immutable_in_runtime: true

# Perfiles oficiales de evaluación (Auditoría Cap. 9 vs Cap. 15)
profiles:
  agent_paper:
    description: "Perfil Proyecto Final (Cap. 15): Capital 50,000, comisión 0.0%"
    initial_capital: 50000.0
    fee_pct: 0.0
  practice_backtest:
    description: "Perfil Práctica T4 (Cap. 9): Capital 100,000, comisión 0.10%"
    initial_capital: 100000.0
    fee_pct: 0.001

# Límites deterministas de ejecución (Hard Gate)
risk_controls:
  max_exposure_pct: 1.0
  max_daily_loss_pct: 0.03
  slippage_bps: 5
  min_lot_size: 0.0001
  step_size: 0.0001
  long_only: true
  allow_leverage: false
  allow_short_selling: false
  enable_real_trading: false
  max_data_age_seconds: 172800
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 3.5
  trailing_stop_pct: 0.035
  max_single_position_pct: 0.45

